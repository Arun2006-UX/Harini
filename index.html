  <style>
    :root{
      --ink:#18362f;--ink-2:#29483f;--forest:#4f7964;--forest-2:#668d76;--sage:#dce9df;--sage-2:#eef4ee;
      --paper:#fffefb;--canvas:#f5f3ed;--line:#eae8df;--muted:#7e877f;--soft:#a7ada4;--amber:#e69b55;
      --amber-bg:#fff2df;--red:#bd6255;--red-bg:#fbebe7;--blue:#647fa0;--blue-bg:#edf2f8;--shadow:0 14px 42px rgba(33,54,44,.07);
      --radius:18px;--radius-sm:12px;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--serif:Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(79,121,100,.34);outline-offset:2px}
    .app-shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:244px;background:var(--ink);color:#e5ece4;padding:27px 17px 18px;display:flex;flex-direction:column;z-index:20}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px 30px}.brand img{width:34px;height:34px;border-radius:10px}.brand-name{font-size:19px;font-weight:730;letter-spacing:-.06em;color:#fff}.brand-tag{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#8fa59a;margin-top:3px}
    .nav-label{padding:0 12px;margin:18px 0 8px;color:#82988d;font-size:9px;letter-spacing:.16em;font-weight:750;text-transform:uppercase}.nav-list{display:grid;gap:4px}.nav-item{border:0;background:transparent;color:#bdcbc1;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 12px;border-radius:11px;font-size:12px;font-weight:580;transition:background .18s,color .18s}.nav-item:hover{background:rgba(255,255,255,.075);color:#fff}.nav-item.active{background:#2b4a3e;color:#fff;box-shadow:inset 3px 0 #e8a664}.nav-item .icon{width:17px;height:17px;opacity:.95}.nav-trail{margin-left:auto;font-size:9px;background:#3e594d;color:#e8d2b4;padding:3px 6px;border-radius:6px}
    .side-spacer{flex:1}.side-note{margin:16px 5px 16px;padding:15px 14px 14px;border:1px solid rgba(232,241,232,.14);border-radius:14px;background:rgba(255,255,255,.045)}.side-note-top{display:flex;align-items:center;gap:8px;color:#c2d6c8;font-size:10px;font-weight:650}.side-note p{margin:9px 0 0;color:#9db0a4;font-size:10px;line-height:1.55}.side-note b{color:#fff}.profile{border-top:1px solid rgba(255,255,255,.12);padding:17px 8px 2px;display:flex;align-items:center;gap:10px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e5d9c4;color:#3b4a3d;font-size:11px;font-weight:750}.profile-text{min-width:0}.profile-name{font-size:11px;color:white;font-weight:630}.profile-plan{font-size:9px;color:#9bb0a4;margin-top:3px}.profile-more{margin-left:auto;color:#8fa49a}
    .main{margin-left:244px;min-height:100vh;padding:0 40px 48px;max-width:1700px}.topbar{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e8e6de}.topbar-left{display:flex;align-items:center;gap:13px;min-width:0}.mobile-brand{display:none;align-items:center;gap:8px;font-weight:750;font-size:18px}.mobile-brand img{width:29px;height:29px;border-radius:8px}.date-label{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:650;margin-bottom:4px}.topbar h1{font-family:var(--serif);font-size:23px;letter-spacing:-.035em;margin:0;font-weight:500;line-height:1.1}.topbar-sub{font-size:10px;color:var(--muted);margin:5px 0 0}.top-actions{display:flex;align-items:center;gap:9px}.search-wrap{position:relative}.search-wrap .icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#7c877e;width:15px;height:15px}.search-input{height:37px;width:220px;border:1px solid #e5e4dc;background:rgba(255,254,251,.83);border-radius:10px;padding:0 28px 0 34px;font-size:11px;color:var(--ink)}.search-input::placeholder{color:#a1a59d}.key-hint{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;color:#979c95;border:1px solid #e5e4dc;border-radius:4px;padding:1px 4px}.icon-button{height:37px;width:37px;border:1px solid #e5e4dc;background:var(--paper);border-radius:10px;color:var(--ink);display:grid;place-items:center;position:relative}.icon-button:hover{background:var(--sage-2)}.icon-button .icon{width:16px;height:16px}.notification-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--amber);right:7px;top:7px;border:1px solid white}.primary-button,.secondary-button,.soft-button,.text-button{border:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;transition:transform .15s,background .15s,color .15s}.primary-button{background:var(--ink);color:#fff;padding:10px 14px;font-size:11px;box-shadow:0 4px 10px rgba(24,54,47,.09)}.primary-button:hover{background:#24483c;transform:translateY(-1px)}.primary-button .icon,.secondary-button .icon,.soft-button .icon{width:15px;height:15px}.secondary-button{background:#fff;border:1px solid var(--line);color:var(--ink);padding:9px 13px;font-size:10px}.secondary-button:hover{background:var(--sage-2)}.soft-button{background:var(--sage-2);color:var(--forest);padding:8px 11px;font-size:10px}.soft-button:hover{background:#e1ece2}.text-button{background:transparent;color:var(--forest);padding:5px;font-size:10px}.text-button:hover{color:var(--ink)}
    .view-host{padding-top:25px}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-heading h2{font-family:var(--serif);font-size:25px;line-height:1.1;font-weight:500;letter-spacing:-.04em;margin:0}.page-heading p{color:var(--muted);font-size:11px;margin:7px 0 0;line-height:1.5}.eyebrow{font-size:9px;letter-spacing:.15em;font-weight:760;text-transform:uppercase;color:var(--muted);margin:0 0 8px}.eyebrow.light{color:#b7cbbd}.section-title{font-family:var(--serif);font-weight:500;letter-spacing:-.025em;font-size:17px;margin:0}.section-sub{font-size:10px;color:var(--muted);margin:5px 0 0;line-height:1.45}.card{background:var(--paper);border:1px solid rgba(230,228,218,.78);border-radius:var(--radius);box-shadow:0 3px 16px rgba(40,54,41,.025)}.card-pad{padding:19px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head .section-sub{max-width:400px}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.86fr);gap:15px}.focus-card{position:relative;overflow:hidden;min-height:248px;padding:24px;background:var(--ink);border-radius:var(--radius);color:#fff;display:flex;align-items:stretch;box-shadow:0 10px 28px rgba(24,54,47,.1)}.focus-copy{position:relative;z-index:2;max-width:68%;display:flex;flex-direction:column;align-items:flex-start}.focus-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#bfd2c4;font-weight:750;display:flex;align-items:center;gap:7px}.status-pulse{width:6px;height:6px;border-radius:50%;background:#f0b36c;box-shadow:0 0 0 4px rgba(240,179,108,.12)}.focus-title{font-family:var(--serif);font-size:27px;line-height:1.12;letter-spacing:-.035em;font-weight:500;margin:16px 0 8px;max-width:480px}.focus-description{font-size:11px;line-height:1.65;color:#c3d0c6;margin:0;max-width:430px}.focus-meta{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 15px}.dark-chip{padding:5px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.16);color:#e7eee7;font-size:9px;display:inline-flex;gap:5px;align-items:center}.focus-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.focus-actions .primary-button{background:#f2e9d8;color:#244137;box-shadow:none}.focus-actions .primary-button:hover{background:#fff}.focus-actions .text-button{color:#d4e1d6}.focus-actions .text-button:hover{color:#fff}.hero-orbit{position:absolute;right:-23px;top:-45px;width:275px;height:275px;border:1px solid rgba(216,231,218,.12);border-radius:50%}.hero-orbit:before,.hero-orbit:after{content:"";position:absolute;border:1px solid rgba(216,231,218,.1);border-radius:50%;inset:28px}.hero-orbit:after{inset:65px}.hero-orbit-dot{position:absolute;right:29px;top:102px;width:12px;height:12px;border-radius:50%;background:#e5a05e;box-shadow:0 0 0 8px rgba(229,160,94,.1)}.focus-side-stat{position:absolute;right:20px;bottom:20px;text-align:right;z-index:2}.focus-side-stat strong{font-family:var(--serif);font-size:24px;font-weight:500;color:#f1ce9d}.focus-side-stat span{display:block;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#afc3b4;margin-top:3px}

  const handleClick=async(e)=>{
    const pageButton=e.target.closest('[data-page]');if(pageButton){e.preventDefault();if(pageButton.dataset.page==='obligations'&&page!=='obligations')activeFilter='All';setPage(pageButton.dataset.page);return}

    const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const id=button.dataset.id;
    if(action==='overlay-close'){if(e.target===button)closeModal();return}
    if(action==='close-modal'){closeModal();return}
    if(action==='quick-actions'){openQuickActions();return}
    if(action==='go-reminders'){setPage('reminders');return}
    if(action==='create-task'){closeModal();taskForm(null,'Utility');return}
    if(action==='create-document'){closeModal();taskForm(null,'Document');return}
    if(action==='open-workflow'||action==='why'){openTask(id);return}
    if(action==='edit-task'){const task=state.items.find(t=>t.id===id);if(task)taskForm(task);return}
    if(action==='workflow-next'){const task=state.items.find(t=>t.id===id);if(!task)return;if(task.status==='done'){toast('This obligation is already completed.');return}if(task.amount!=null&&['Utility','Insurance','Subscription'].includes(task.category)){openPayment(id);return}setDone(id,task.category==='Appointment'?'appointment':'handled');return}
    if(action==='confirm-payment'){setDone(id,'payment');return}
    if(action==='snooze'){closeModal();snooze(id);return}
    if(action==='delete-task'){deleteTask(id);return}
    if(action==='reopen-task'){const task=state.items.find(t=>t.id===id);if(task){task.status='open';delete task.completedAt;delete task.outcome;recordActivity(`Reopened ${task.title}`);save();closeModal();render();toast('Obligation reopened.')}return}
    if(action==='filter'){activeFilter=button.dataset.filter;render();return}
    if(action==='filter-category'){activeFilter=button.dataset.category;setPage('obligations');return}
    if(action==='quick-pay'){closeModal();const task=dueSorted().find(t=>t.amount!=null&&['Utility','Insurance'].includes(t.category));if(task)openTask(task.id);else taskForm(null,'Utility');return}
    if(action==='quick-appointment'){closeModal();taskForm(null,'Appointment');return}
    if(action==='quick-document'){closeModal();taskForm(null,'Document');return}
    if(action==='quick-subscription'){closeModal();activeFilter='Subscription';setPage('obligations');return}
    if(action==='quick-vehicle'){closeModal();taskForm(null,'Vehicle');return}
    if(action==='quick-custom'){closeModal();taskForm(null,'Utility');return}

    if(action==='choose-plan'){const plan=button.dataset.plan;if(state.plan===plan){toast(`${plan} is already selected for this demo.`);return}if(plan==='Essential'){state.plan='Essential';save();render();toast('Essential selected in this local demo.');return}openModal('Preview Orbit Plus','Switching plans is only a local demo action.',`<div class="detail-card"><div class="detail-grid"><div><span class="detail-label">Plan preview</span><span class="detail-value">Orbit Plus · $5.99/month (illustrative)</span></div><div><span class="detail-label">Assisted transaction rate</span><span class="detail-value">0.25%, capped at $1.00</span></div></div></div><div class="demo-disclaimer">${icon('lock')}<span>No payment method will be requested and no subscription will be purchased. The selection only updates this demo’s plan label.</span></div>`,`<button class="secondary-button" data-action="close-modal">Keep my plan</button><button class="primary-button" data-action="confirm-plan" data-plan="Plus">Choose Plus for demo</button>`);return}
    if(action==='confirm-plan'){state.plan=button.dataset.plan||'Plus';save();closeModal();render();toast('Plus is now selected in your demo. No charge was made.');return}
    if(action==='edit-priorities'){openPriorityChooser();return}
    if(action==='undo-last'){if(lastUndo){const t=state.items.find(x=>x.id===lastUndo.id);if(t){t.status=lastUndo.previous||'open';delete t.completedAt;delete t.outcome;recordActivity(`Undid completion for ${t.title}`);save();render();toast('Last completion was undone.')}lastUndo=null}return}

  const handleChange=async(e)=>{const t=e.target;if(t.id==='sortMode'){sortMode=t.value;render();return}if(t.id==='focusPref'){state.prefs.focus=t.value;save();render();toast('Your priority preference was saved.');return}if(t.id==='channelPref'){state.prefs.channel=t.value;save();render();toast('Preferred reminder channel saved.');return}if(t.id==='quietPref'){state.prefs.quietHours=t.value;save();render();toast('Quiet hours updated.');return}if(t.classList.contains('priority-toggle')){const set=new Set(state.prefs.preferredCategories||[]);t.checked?set.add(t.value):set.delete(t.value);state.prefs.preferredCategories=[...set];save();render();toast('Priority categories updated.');return}if(t.dataset.setting){const key=t.dataset.setting;if(key.startsWith('reminder-')){const day=Number(key.split('-')[1]);const values=new Set(state.prefs.reminderDays||[]);t.checked?values.add(day):values.delete(day);state.prefs.reminderDays=[...values].sort((a,b)=>b-a);save();render();toast('Reminder timing updated.');return}if(key==='smart'){state.prefs.smartSuggestions=t.checked;save();render();toast('Smart suggestions preference updated.');return}if(key==='browser'){if(t.checked&&'Notification'in window&&Notification.permission==='default'){try{const p=await Notification.requestPermission();if(p!=='granted'){t.checked=false;state.prefs.browserAlerts=false;save();toast('Browser permission was not granted.');return}}catch(_){t.checked=false;state.prefs.browserAlerts=false;return}}if(t.checked&&(!('Notification'in window)||Notification.permission!=='granted')){t.checked=false;toast('Browser notifications are not available or were not permitted.');return}state.prefs.browserAlerts=t.checked;save();toast(t.checked?'Browser alerts enabled for this device while this page is open.':'Browser alerts turned off.');return}}

  const handleInput=(e)=>{if(e.target.id!=='globalSearch')return;const pos=e.target.selectionStart;query=e.target.value;if(query&&page!=='obligations'){page='obligations';activeFilter='All';$$('.nav-item').forEach(b=>{const a=b.dataset.page===page;b.classList.toggle('active',a);if(a)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$$('.bottom-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}render();$('#globalSearch').value=query;$('#globalSearch').focus();if(pos!=null)$('#globalSearch').setSelectionRange(pos,pos)};
